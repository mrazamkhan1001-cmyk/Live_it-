name: liveitbyazam
description: "LIVE IT BY AZAM - Premium Anime Music Streaming Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.15
  audio_session: ^0.1.25
  video_player: ^2.9.2
  http: ^1.3.0
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/video/sharingan_android.mp4
    - assets/images/
    - assets/images/live_it_logo.png
    - assets/images/live_it_loading.png
    - assets/images/login_background.png
    - assets/images/signup_background.png
    - assets/images/profile_background.png
    - assets/images/search_background.png
